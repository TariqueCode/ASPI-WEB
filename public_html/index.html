<!DOCTYPE html>
<html lang="bn" class="scroll-smooth" x-data="frontendApp()" x-init="init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="t('institution_name') + ' | ASPI'">আসহাব সিরাজ পলিটেকনিক ইনস্টিটিউট | ASPI</title>
    <meta name="theme-color" content="#020617">
    <link rel="icon" type="image/png" href="assets/images/ASPI-Logo.png">
    <link rel="apple-touch-icon" href="assets/images/ASPI-Logo.png">
    <style id="aspi-local-font">
        @font-face{font-family:'Hind Siliguri';src:url('assets/fonts/Hind-Siliguri-Regular.ttf') format('truetype');font-style:normal;font-weight:300 800;font-display:swap;}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { bn: ['var(--dynamic-font)', 'Hind Siliguri', 'sans-serif'] },
                    colors: { brand: { blue: '#020617', gold: '#facc15', green: '#16a34a', night: '#000000' } },
                    animation: { 'marquee': 'marquee 30s linear infinite', 'float': 'float 6s ease-in-out infinite', 'gradient': 'gradient 8s ease infinite' },
                    keyframes: { 
                        marquee: { '0%': { transform: 'translateX(100vw)' }, '100%': { transform: 'translateX(-100%)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-15px)' } },
                        gradient: { '0%, 100%': { backgroundPosition: '0% 50%' }, '50%': { backgroundPosition: '100% 50%' } }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        // Keep non-critical images from blocking first paint.
        document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('img').forEach(function(img){
                if(!img.hasAttribute('loading')) img.loading='lazy';
                if(!img.hasAttribute('decoding')) img.decoding='async';
            });
        });
    </script>

    <style>
        :root { --dynamic-font: 'Hind Siliguri'; }
        body { font-family: var(--dynamic-font), sans-serif; transition: font-size 0.3s ease; }
        .header-control { color:#ef4444 !important; border:2px solid rgba(239,68,68,.35); background:rgba(255,255,255,.85); }
        .dark .header-control { color:#ef4444 !important; background:rgba(15,23,42,.8); border-color:rgba(239,68,68,.45); }
        .founder-highlight { background:linear-gradient(135deg, rgba(30,41,59,.98), rgba(15,23,42,.96)); color:white; }
        .founder-highlight .founder-cta { background:#ef4444; color:white; box-shadow:0 14px 30px rgba(239,68,68,.28); }
        .event-media-thumb { height:9rem; object-fit:cover; width:100%; }

        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); }
        .dark .glass-nav { background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .bg-gradient-anim { position: fixed; inset: 0; z-index: -2; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .dark .bg-gradient-anim { background: linear-gradient(135deg, #050505 0%, #0f172a 100%); }
        .marquee-container:hover .animate-marquee { animation-play-state: paused; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        [x-cloak] { display: none !important; }
        .scroll-reveal { opacity: 0; transform: translateY(40px) scale(0.98); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .scroll-reveal.active { opacity: 1; transform: translateY(0) scale(1); }

        /* ভাষা সুইচার (স্মার্ট) */
        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s;
            font-weight: 700;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
        }
        .lang-switch:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        .dark .lang-switch {
            border-color: rgba(255,255,255,0.1);
        }
        .lang-switch i {
            font-size: 1.1rem;
            transition: transform 0.3s;
        }
        .lang-switch:hover i {
            transform: rotate(25deg);
        }
        .lang-switch .lang-label {
            opacity: 0.85;
        }

        /* মোবাইলে ভাষা সুইচার - মেনুর ভিতরে */
        .mobile-lang-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            font-weight: 700;
            width: 100%;
            margin-top: 0.5rem;
        }
        .mobile-lang-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* মোবাইল মেনু */
        .mobile-menu {
            background: rgba(15, 23, 42, 0.98) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dark .mobile-menu {
            background: rgba(5, 5, 5, 0.98) !important;
        }
        .mobile-menu a {
            color: #f1f5f9;
        }
        .mobile-menu a:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Apply Now বাটন হাইলাইট */
        .btn-apply {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #000;
            font-weight: 900;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.5);
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            animation: pulse-gold 2s infinite;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-apply:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(250, 204, 21, 0.7);
        }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }

        /* ডার্ক মোডে পপআপ ও ড্রপডাউন */
        .dark .bg-white { background-color: #1e293b !important; }
        .dark .border-slate-200 { border-color: #475569 !important; }
        .dark .text-slate-900 { color: #f1f5f9 !important; }
        .dark .text-slate-700 { color: #cbd5e1 !important; }
        .dark .text-slate-600 { color: #94a3b8 !important; }
        .dark select, .dark input, .dark textarea {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
            border-color: #475569 !important;
        }
        .dark select option {
            background-color: #1e293b !important;
            color: #f1f5f9 !important;
        }

        /* ভর্তি ট্যাব */
        .admission-tab-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .admission-tab-btn.active {
            background: #1e293b;
            color: #fff;
            border-color: #facc15;
        }
        .dark .admission-tab-btn.active {
            background: #facc15;
            color: #000;
        }
        .admission-tab-btn:not(.active) {
            background: rgba(0,0,0,0.05);
            color: #475569;
        }
        .dark .admission-tab-btn:not(.active) {
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
        }

        /* গ্যালারি পপআপ */
        .gallery-popup-overlay {
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
        }
        .gallery-popup-content {
            max-width: 90vw;
            max-height: 90vh;
        }
        .gallery-popup-content img,
        .gallery-popup-content iframe {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .gallery-nav-btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 9999px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .gallery-nav-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .gallery-download-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .gallery-download-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        @media (max-width: 640px) {
            .gallery-popup-content { max-width: 98vw; }
            .gallery-nav-btn { padding: 0.4rem 0.6rem; }
            .mobile-menu a { font-size: 0.9rem; padding: 0.75rem 1rem; }
        }

        /* গ্যালারি কার্ড স্টাইল */
        .gallery-card {
            transition: all 0.3s ease;
            border-radius: 1.5rem;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        .dark .gallery-card {
            background: #1e293b;
            border-color: #334155;
        }
        .gallery-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
        .gallery-card img {
            transition: transform 0.5s ease;
        }
        .gallery-card:hover img {
            transform: scale(1.05);
        }
    </style>
<style x-text="data.site.custom_font ? '@font-face{font-family:ASPI-Custom;src:url(' + assetUrl(data.site.custom_font) + ');font-display:swap;} :root{--dynamic-font:ASPI-Custom;}' : ''"></style>

<style id="aspi-layout-fix">

  .container { max-width: 768px; }
}

</style>


<style id="aspi-v6-main-controls">
.header-control{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.05))!important;border:1px solid rgba(148,163,184,.28)!important;box-shadow:0 8px 22px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px)}
.aspi-theme-toggle{width:42px!important;height:42px!important;border-radius:14px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;background:linear-gradient(135deg,#0f172a,#1e293b)!important;color:#fde68a!important;border:1px solid rgba(250,204,21,.25)!important}
.aspi-lang-control{min-height:42px!important;padding:0 12px!important;border-radius:14px!important;background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(14,165,233,.08))!important;border:1px solid rgba(96,165,250,.30)!important;display:inline-flex!important;align-items:center!important;gap:8px!important;font-weight:900!important}
.aspi-admission-info{position:relative;overflow:hidden;border:1px solid rgba(96,165,250,.18);background:radial-gradient(circle at 90% 0%,rgba(250,204,21,.10),transparent 20rem),linear-gradient(145deg,rgba(15,23,42,.98),rgba(17,31,52,.96));box-shadow:0 25px 60px rgba(2,6,23,.20)}
.aspi-admission-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(250,204,21,.10);border:1px solid rgba(250,204,21,.30);color:#fde68a;font-weight:900;font-size:.78rem}
.aspi-info-card{border:1px solid rgba(148,163,184,.14);background:rgba(30,41,59,.56);border-radius:20px;padding:22px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.aspi-info-card:hover{transform:translateY(-3px);border-color:rgba(250,204,21,.28);box-shadow:0 16px 35px rgba(2,6,23,.20)}
.aspi-info-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(59,130,246,.15);color:#60a5fa;font-size:1.15rem;margin-bottom:14px}
.aspi-course-number{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:rgba(250,204,21,.12);color:#fde047;font-weight:900;flex:none}
.aspi-prospectus-card{overflow:hidden;border:1px solid rgba(148,163,184,.16);border-radius:20px;background:rgba(15,23,42,.72)}
.aspi-prospectus-card img{width:100%;height:260px;object-fit:cover;object-position:top}
.aspi-contact-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid rgba(148,163,184,.13)}.aspi-contact-row:last-child{border-bottom:0}
@media(max-width:640px){.aspi-prospectus-card img{height:220px}}
</style>


<style id="aspi-v7-main-refinement">
/* Continuous full-page background: outer breathing room is the same surface. */
html,body{
  background:var(--page-bg,#0b1422)!important;
}
body.dark, .dark body{
  background:var(--page-bg-dark,#08111f)!important;
}
#app, .min-h-screen, main{
  background:transparent!important;
}
@media(min-width:1024px){
  body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:inherit;
  }
}

/* Larger corner/header logo without making the header bulky. */
header img[alt*="ASPI"], header img[src*="ASPI-Logo"]{
  width:62px!important;
  height:62px!important;
  min-width:62px!important;
  object-fit:contain!important;
  border-radius:16px!important;
  background:#fff!important;
  box-shadow:0 8px 24px rgba(0,0,0,.24),0 0 0 2px rgba(250,204,21,.16)!important;
}
@media(min-width:1024px){
  header img[alt*="ASPI"], header img[src*="ASPI-Logo"]{
    width:76px!important;height:76px!important;min-width:76px!important;border-radius:19px!important;
  }
}

/* Gold section separators for top navigation/options. */
header nav a, header nav button{
  position:relative;
}
header nav a:not(:last-child)::after,
header nav button:not(:last-child)::after{
  content:"";
  position:absolute;
  top:22%;
  right:-1px;
  width:1px;
  height:56%;
  background:linear-gradient(to bottom,transparent,#facc15,transparent);
  opacity:.72;
}
header nav a:hover::before,
header nav button:hover::before{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  bottom:-3px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#facc15,transparent);
}

/* Social media: clicked/active cards retain their brand colour.
   A small inline script below adds the .is-active state. */
.aspi-social-link{
  --brand:#64748b;
  border:1px solid rgba(148,163,184,.16)!important;
  transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease!important;
}
.aspi-social-link .aspi-social-icon{
  transition:all .2s ease!important;
}
.aspi-social-link:hover,
.aspi-social-link.is-active{
  background:color-mix(in srgb,var(--brand) 13%,transparent)!important;
  border-color:color-mix(in srgb,var(--brand) 60%,transparent)!important;
  box-shadow:0 10px 28px color-mix(in srgb,var(--brand) 20%,transparent)!important;
}
.aspi-social-link:hover .aspi-social-icon,
.aspi-social-link.is-active .aspi-social-icon{
  background:var(--brand)!important;
  color:#fff!important;
  border-color:var(--brand)!important;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 13%,transparent)!important;
}
.aspi-social-link.is-active{
  transform:translateY(-2px);
}
@supports not (color:color-mix(in srgb, red 10%, transparent)){
  .aspi-social-link:hover,.aspi-social-link.is-active{background:rgba(59,130,246,.14)!important;border-color:rgba(59,130,246,.5)!important}
}

/* Founder image: never crop the head. */
.aspi-founder-portrait{
  width:150px!important;
  height:180px!important;
  object-fit:contain!important;
  object-position:center top!important;
  background:#fff!important;
  padding:6px!important;
  border-radius:18px!important;
}

</style>
</head>

<body class="text-gray-900 dark:text-gray-100 transition-colors duration-500 overflow-x-hidden" :style="`font-size: ${data.site.font_size || 16}px;`">

    <!-- SPLASH SCREEN -->
    <div x-show="splashVisible" x-transition:leave.duration.800ms class="fixed inset-0 z-[200] flex items-center justify-center bg-gradient-to-b from-slate-900 to-slate-800 dark:from-slate-950 dark:to-slate-900">
        <div class="text-center px-6">
            <div class="relative w-32 h-32 sm:w-40 sm:h-40 mx-auto mb-6">
                <div class="absolute inset-0 border-4 border-brand-gold/30 rounded-full animate-ping"></div>
                <div class="absolute inset-0 border-4 border-brand-gold/20 rounded-full animate-ping" style="animation-delay: 0.5s;"></div>
                <img :src="assetUrl(data.site.logo) || 'assets/images/ASPI-Logo.png'" @error="$event.target.src='assets/images/ASPI-Logo.png'" alt="Logo" class="w-full h-full object-contain rounded-full bg-white/10 p-2 border-2 border-brand-gold/50 shadow-xl animate-float">
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-white tracking-widest leading-tight" x-text="t('institution_name')"></h2>
            <p class="text-sm text-slate-400 mt-3 tracking-wide" x-text="t('established')"></p>
            <div class="mt-8 flex justify-center">
                <div class="w-12 h-1 bg-brand-gold/60 rounded-full animate-pulse"></div>
            </div>
        </div>
    </div>

    <!-- POPUP NOTIFICATION -->
    <div x-show="popupOpen" class="fixed inset-0 z-[180] flex items-center justify-center px-4" x-cloak>
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" @click="closePopup()"></div>
        <div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden">
            <button @click="closePopup()" class="absolute top-3 right-3 z-10 text-white bg-black/60 hover:bg-black/80 rounded-full p-2 transition-all">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div class="relative">
                <img :src="'../' + currentPopupImage" class="w-full h-auto max-h-[70vh] object-contain">
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
                    <template x-for="(img, idx) in popupImages" :key="idx">
                        <button @click="currentPopupIndex = idx" class="w-2 h-2 rounded-full transition-all" :class="idx === currentPopupIndex ? 'bg-white w-4' : 'bg-white/50'"></button>
                    </template>
                </div>
            </div>
            <div class="flex justify-between items-center p-3 bg-slate-100 dark:bg-slate-800">
                <span class="text-sm font-bold text-slate-600 dark:text-slate-300" x-text="(currentPopupIndex+1) + '/' + popupImages.length"></span>
                <div class="flex gap-2">
                    <button @click="prevPopup()" class="px-4 py-1 bg-brand-blue text-white rounded-lg font-bold hover:bg-blue-700 text-sm" x-text="t('prev')"></button>
                    <button @click="nextPopup()" class="px-4 py-1 bg-brand-blue text-white rounded-lg font-bold hover:bg-blue-700 text-sm" x-text="t('next')"></button>
                    <button @click="closePopup()" class="px-4 py-1 bg-slate-300 dark:bg-slate-600 rounded-lg font-bold text-sm" x-text="t('close')"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- GALLERY POPUP VIEWER (with attachments) -->
    <div x-show="galleryPopupOpen" class="fixed inset-0 z-[150] flex items-center justify-center px-4 gallery-popup-overlay" x-cloak>
        <div class="absolute inset-0" @click="galleryPopupOpen = false"></div>
        <div class="gallery-popup-content relative bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden">
            <button @click="galleryPopupOpen = false" class="absolute top-3 right-3 z-10 text-white bg-black/60 hover:bg-black/80 rounded-full p-2 transition-all">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
            <a x-show="currentPopupAttachment" :href="'../' + currentPopupAttachment.file_url" download target="_blank" class="absolute top-3 right-16 z-10 text-white bg-black/60 hover:bg-black/80 rounded-full p-2 transition-all">

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('frontendApp', () => ({
                // ======================== STATE ========================
                darkMode: false,
                mobileMenuOpen: false,
                splashVisible: true,
                currentLang: 'bn',
                translations: {},

                // Admission
                admissionModal: false,
                admissionType: 'diploma',

                // Diploma
                diplomaVerified: false,
                diplomaVerifying: false,
                diplomaVerifyError: '',
                diplomaSubmitting: false,
                diplomaVerify: { board: '', year: '', roll: '', registration: '', captcha: '' },
                diplomaForm: { 
                    student_name: '', father_name: '', mother_name: '', 
                    phone: '', address: '', ssc_gpa: '', 
                    course_type: 'diploma', course_name: '', 
                    photo_path: '', board: '', roll: '', registration: '' 
                },

                // NSDA
                nsdaSubmitting: false,
                nsdaForm: {
                    student_name: '', father_name: '', mother_name: '',
                    phone: '', address: '', age: '', ssc_status: 'passed',
                    course_type: 'nsda', course_name: '', photo_path: ''
                },

                // Captcha
                captchaUrl: 'api.php?action=get_captcha&t=' + Date.now(),

                // Data
                data: {
                    site: {
                        font_size: '16', custom_font: '', logo: '', phone: '', email: '',
                        address: '', address_en: '',
                        master_admission: true, diploma_admission: true, nsda_admission: true,
                        marquee_speed: 30, popup_animation_delay: 3000,
                        popup_enabled: false, popup_images: []
                    },
                    scraper: { eligibility: {} },
                    messages: [], notices: [], events: [], news: [], teachers: [], courses: [], admissions: []
                },

                // Gallery
                galleryItems: [],
                galleryPopupOpen: false,
                popupAttachments: [],
                popupIndex: 0,
                currentPopupAttachment: null,

                // Popup notification
                popupOpen: false,
                popupImages: [],
                currentPopupIndex: 0,

                // Event popup
                eventPopupOpen: false,
                currentEvent: {},
                currentEventMedia: [],
                eventMediaIndex: 0,

                // Notice filter
                noticeFilter: 'all',

                // Social links
                socialLinks: [],

                // ======================== TRANSLATION ========================
                t(key) { return this.translations[key] || key; },
                assetUrl(path) {
                    if (!path) return '';
                    if (/^(https?:)?\/\//i.test(path) || path.startsWith('/')) return path;
                    return path.replace(/^\.\//, '');
                },
                logoFallback(event) { event.target.src = 'assets/images/ASPI-Logo.png'; },

                async loadTranslations(lang) {
                    try {
                        const res = await fetch(`/languages/${lang}.json`);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        this.translations = await res.json();
                    } catch (e) {
                        console.warn('Translation fallback', e);
                        this.translations = {};
                    }
                },

                // ======================== INIT ========================
                init() {
                    // Theme
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const savedTheme = localStorage.getItem('aspi_theme');
                    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                        this.darkMode = true;
                        document.documentElement.classList.add('dark');
                    } else {
                        this.darkMode = false;
                        document.documentElement.classList.remove('dark');
                    }

                    // Language
                    const savedLang = localStorage.getItem('aspi_lang') || 'bn';
                    this.currentLang = ['bn','en'].includes(savedLang) ? savedLang : (navigator.language?.toLowerCase().startsWith('en') ? 'en' : 'bn');
                    this.loadTranslations(this.currentLang);
                     document.documentElement.lang = this.currentLang;

                    // Fetch data
                    this.fetchData();
                    this.fetchGallery();
                    this.fetchSocialLinks();

                    // Splash screen and popup
                    setTimeout(() => {
                        this.splashVisible = false;
                        if (this.data.site.popup_enabled && this.popupImages.length > 0) {
                            this.popupOpen = true;
                        }
                    }, 2800);

                    // Auto-refresh
                    setInterval(() => {
                        this.fetchData();
                        this.fetchGallery();
                        this.fetchSocialLinks();
                    }, 300000);
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    document.documentElement.classList.toggle('dark', this.darkMode);
                    localStorage.setItem('aspi_theme', this.darkMode ? 'dark' : 'light');
                },

                switchLanguage(lang) {
                    if (lang === this.currentLang) return;
                    this.currentLang = lang;
                    localStorage.setItem('aspi_lang', lang);
                    this.loadTranslations(lang);
                    this.fetchData();
                    this.fetchGallery();
                    this.fetchSocialLinks();
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    try {
                        const d = new Date(dateStr);
                        if (!isNaN(d)) {
                            return d.toLocaleDateString(this.currentLang === 'en' ? 'en-US' : 'bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
                        }
                    } catch(e) {}
                    return dateStr;
                },

                // ======================== DATA FETCHING ========================
                async fetchData() {
                    try {
                        const lang = this.currentLang || 'bn';
                        const res = await fetch(`api.php?lang=${lang}`);
                        const json = await res.json();
                        if (!json.error) {
                            this.data = json;
                            document.documentElement.lang = this.currentLang;
                            if (this.data.site.popup_images) {
                                this.popupImages = typeof this.data.site.popup_images === 'string' ? JSON.parse(this.data.site.popup_images) : this.data.site.popup_images;
                            }
                            if (!this.data.site.marquee_speed) this.data.site.marquee_speed = 30;
                            if (!this.data.site.font_size) this.data.site.font_size = 16;
                        }
                    } catch (e) { console.error('Data load error', e); }
                },

                async fetchGallery() {
                    try {
                        const res = await fetch('api.php?action=get_gallery_items');
                        const json = await res.json();
                        if (json.gallery) this.galleryItems = json.gallery;
                    } catch (e) { console.error('Gallery load error', e); }
                },

                async fetchSocialLinks() {
                    try {
                        const res = await fetch('api.php?action=get_social_links');
                        const json = await res.json();
                        if (json.social_links) this.socialLinks = json.social_links;
                    } catch (e) { console.error('Social links load error', e); }
                },

                // ======================== GALLERY POPUP ========================
                async openGalleryPopup(item) {
                    this.isLoading = true;
                    try {
                        const res = await fetch(`api.php?action=get_gallery_attachments&id=${item.id}`);
                        const json = await res.json();
                        if (json.attachments) {
                            this.popupAttachments = json.attachments;
                            this.popupIndex = 0;
                            if (this.popupAttachments.length > 0) {
                                this.currentPopupAttachment = this.popupAttachments[0];
                                this.galleryPopupOpen = true;
                            }
                        }
                    } catch (e) { console.error(e); }
                    this.isLoading = false;
                },

                nextPopupAttachment() {
                    if (this.popupAttachments.length === 0) return;
                    this.popupIndex = (this.popupIndex + 1) % this.popupAttachments.length;
                    this.currentPopupAttachment = this.popupAttachments[this.popupIndex];
                },

                prevPopupAttachment() {
                    if (this.popupAttachments.length === 0) return;
                    this.popupIndex = (this.popupIndex - 1 + this.popupAttachments.length) % this.popupAttachments.length;
                    this.currentPopupAttachment = this.popupAttachments[this.popupIndex];
                },

                // ======================== POPUP NOTIFICATION ========================
                closePopup() {
                    this.popupOpen = false;
                },

                nextPopup() {
                    if (this.popupImages.length === 0) return;
                    this.currentPopupIndex = (this.currentPopupIndex + 1) % this.popupImages.length;
                },

                prevPopup() {
                    if (this.popupImages.length === 0) return;
                    this.currentPopupIndex = (this.currentPopupIndex - 1 + this.popupImages.length) % this.popupImages.length;
                },

                get currentPopupImage() {
                    if (this.popupImages.length === 0) return '';
                    return this.popupImages[this.currentPopupIndex] || this.popupImages[0];
                },

                // ======================== EVENT POPUP ========================
                openEventPopup(item) {
                    this.currentEvent = item;
                    this.currentEventMedia = Array.isArray(item.media) ? item.media : [];
                    this.eventMediaIndex = 0;
                    this.eventPopupOpen = true;
                },
                nextEventMedia() { if (this.currentEventMedia.length) this.eventMediaIndex = (this.eventMediaIndex + 1) % this.currentEventMedia.length; },
                prevEventMedia() { if (this.currentEventMedia.length) this.eventMediaIndex = (this.eventMediaIndex - 1 + this.currentEventMedia.length) % this.currentEventMedia.length; },

                // ======================== CAPTCHA ========================
                refreshCaptcha() {
                    this.captchaUrl = 'api.php?action=get_captcha&t=' + Date.now();
                },

                // ======================== ADMISSION ========================
                openAdmissionModal(type) {
                    this.admissionType = type;
                    this.admissionModal = true;
                    if (type === 'diploma') {
                        this.diplomaVerified = false;
                        this.diplomaVerifyError = '';
                        this.diplomaVerify = { board: '', year: '', roll: '', registration: '', captcha: '' };
                        this.diplomaForm = { 
                            student_name: '', father_name: '', mother_name: '', 
                            phone: '', address: '', ssc_gpa: '', 
                            course_type: 'diploma', course_name: '', 
                            photo_path: '', board: '', roll: '', registration: '' 
                        };
                    } else {
                        this.nsdaForm = {
                            student_name: '', father_name: '', mother_name: '',
                            phone: '', address: '', age: '', ssc_status: 'passed',
                            course_type: 'nsda', course_name: '', photo_path: ''
                        };
                    }
                    this.refreshCaptcha();
                },

                async verifyDiplomaResult() {
                    this.diplomaVerifying = true;
                    this.diplomaVerifyError = '';
                    try {
                        const res = await fetch(`api.php?action=verify_result&lang=${this.currentLang}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.diplomaVerify)
                        });
                        const result = await res.json();
                        if (result.error) {
                            this.diplomaVerifyError = result.error;
                        } else if (result.success) {
                            const d = result.data;
                            this.diplomaForm.student_name = d.name || '';
                            this.diplomaForm.father_name = d.father_name || '';
                            this.diplomaForm.mother_name = d.mother_name || '';
                            this.diplomaForm.ssc_gpa = d.gpa || '';
                            this.diplomaForm.board = d.board || this.diplomaVerify.board;
                            this.diplomaForm.roll = d.roll || this.diplomaVerify.roll;
                            this.diplomaForm.registration = d.registration || this.diplomaVerify.registration;
                            this.diplomaVerified = true;
                        }
                    } catch (e) {
                        this.diplomaVerifyError = this.t('network_error');
                    }
                    this.diplomaVerifying = false;
                },

                async uploadAdmissionPhoto(event, type) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const fd = new FormData();
                    fd.append('file', file);
                    try {
                        const res = await fetch(`api.php?action=upload&lang=${this.currentLang}`, { method: 'POST', body: fd });
                        const result = await res.json();
                        if (result.url) {
                            if (type === 'diploma') this.diplomaForm.photo_path = result.url;
                            else this.nsdaForm.photo_path = result.url;
                        } else {
                            alert(this.t('upload_failed'));
                        }
                    } catch (e) { alert(this.t('upload_error')); }
                },

                async submitDiplomaAdmission() {
                    this.diplomaSubmitting = true;
                    try {
                        const res = await fetch(`api.php?action=submit_diploma_admission&lang=${this.currentLang}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.diplomaForm)
                        });
                        const result = await res.json();
                        if (result.status === 'success') {
                            alert(this.t('admission_success_diploma'));
                            this.admissionModal = false;
                            this.diplomaVerified = false;
                            this.diplomaVerify = { board: '', year: '', roll: '', registration: '', captcha: '' };
                            this.diplomaForm = { 
                                student_name: '', father_name: '', mother_name: '', 
                                phone: '', address: '', ssc_gpa: '', 
                                course_type: 'diploma', course_name: '', 
                                photo_path: '', board: '', roll: '', registration: '' 
                            };
                            this.refreshCaptcha();
                        } else {
                            alert(this.t('application_error') + ': ' + (result.error || this.t('unknown_error')));
                        }
                    } catch (e) { alert(this.t('connection_check')); }
                    this.diplomaSubmitting = false;
                },

                async submitNsdaAdmission() {
                    this.nsdaSubmitting = true;
                    try {
                        const res = await fetch(`api.php?action=submit_nsda_admission&lang=${this.currentLang}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.nsdaForm)
                        });
                        const result = await res.json();
                        if (result.status === 'success') {
                            alert(this.t('admission_success_nsda'));
                            this.admissionModal = false;
                            this.nsdaForm = {
                                student_name: '', father_name: '', mother_name: '',
                                phone: '', address: '', age: '', ssc_status: 'passed',
                                course_type: 'nsda', course_name: '', photo_path: ''
                            };
                            this.refreshCaptcha();
                        } else {
                            alert(this.t('application_error') + ': ' + (result.error || this.t('unknown_error')));
                        }
                    } catch (e) { alert(this.t('connection_check')); }
                    this.nsdaSubmitting = false;
                }
            }));
        });
    </script>

<script id="aspi-v7-social-active">
document.addEventListener('DOMContentLoaded', function(){
  const links = document.querySelectorAll('a[data-aspi-social="1"]');
  links.forEach(function(link){
    link.classList.add('aspi-social-link');
    const icon = link.querySelector('i,svg');
    if(icon) icon.classList.add('aspi-social-icon');
    link.addEventListener('click', function(){
      links.forEach(x => x.classList.remove('is-active'));
      link.classList.add('is-active');
    });
  });
});
</script>
